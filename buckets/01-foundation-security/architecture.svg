<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">AWS Foundation and Security — Category Mind Map</title>
<desc id="desc">An eight-domain AWS foundation and security mind map covering account protection, identity and access, workload identity, organization governance, landing zone, secrets and configuration, encryption, and financial guardrails.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EAF0F7"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26384B"/><stop offset="1" stop-color="#111D2B"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172B43" flood-opacity=".14"/></filter>
  <style>
    .h{font:700 24px Arial,sans-serif;fill:#172B43}.sub{font:14px Arial,sans-serif;fill:#526276}
    .branch{font:700 19px Arial,sans-serif;fill:#172B43}.item{font:15px Arial,sans-serif;fill:#26384B}.small{font:13px Arial,sans-serif;fill:#526276}
    .coretitle{font:700 28px Arial,sans-serif;fill:#fff}.coretext{font:15px Arial,sans-serif;fill:#DCE7F2}
    .line{fill:none;stroke-width:5;stroke-linecap:round;opacity:.85}
    .card{fill:#fff;stroke-width:2;filter:url(#shadow)}.pill{fill:#F5F8FC;stroke:#D8E1EC;stroke-width:1}
  </style>
</defs>
<rect width="1800" height="1200" rx="26" fill="url(#bg)"/>
<text x="900" y="52" text-anchor="middle" class="h" font-size="30">AWS CLOUD ARCHITECTURE PLAYBOOK</text>
<text x="900" y="82" text-anchor="middle" class="sub">BUCKET 01 · FOUNDATION &amp; SECURITY · CATEGORY MIND MAP</text>
<!-- connectors -->
<path class="line" stroke="#D97706" d="M750 510 C650 400 570 300 480 260"/>
<path class="line" stroke="#2563EB" d="M750 570 C630 570 570 580 490 600"/>
<path class="line" stroke="#0F766E" d="M790 690 C670 790 580 875 480 900"/>
<path class="line" stroke="#7C3AED" d="M1050 510 C1150 400 1230 300 1320 260"/>
<path class="line" stroke="#0891B2" d="M1050 570 C1170 570 1230 580 1310 600"/>
<path class="line" stroke="#BE123C" d="M1010 690 C1130 790 1220 875 1320 900"/>
<path class="line" stroke="#4D7C0F" d="M900 470 C900 360 900 290 900 220"/>
<path class="line" stroke="#475569" d="M900 730 C900 840 900 910 900 980"/>
<!-- core -->
<rect x="700" y="470" width="400" height="260" rx="28" fill="url(#core)" stroke="#FF9900" stroke-width="4" filter="url(#shadow)"/>
<text x="900" y="535" text-anchor="middle" class="coretitle">AWS FOUNDATION</text>
<text x="900" y="572" text-anchor="middle" class="coretitle">&amp; SECURITY</text>
<path d="M770 596H1030" stroke="#FF9900" stroke-width="2"/>
<text x="900" y="630" text-anchor="middle" class="coretext">Establish trusted accounts, identities,</text>
<text x="900" y="654" text-anchor="middle" class="coretext">guardrails, secrets and cost controls</text>
<text x="900" y="690" text-anchor="middle" font="13px Arial" fill="#FFCC80">10 CORE TOPICS · 8 ARCHITECTURE DOMAINS</text>
<!-- top -->
<g>
<rect class="card" x="625" y="115" width="550" height="145" rx="18" stroke="#4D7C0F"/>
<circle cx="660" cy="151" r="17" fill="#4D7C0F"/><text x="660" y="157" text-anchor="middle" font="bold 16px Arial" fill="#fff">1</text>
<text x="690" y="158" class="branch">Account protection &amp; root security</text>
<text x="660" y="194" class="item">AWS account and root MFA</text>
<text x="660" y="222" class="small">Root-user MFA · No root access keys · Break-glass controls</text>
</g>
<!-- upper left -->
<g>
<rect class="card" x="65" y="125" width="520" height="245" rx="18" stroke="#D97706"/>
<circle cx="102" cy="164" r="17" fill="#D97706"/><text x="102" y="170" text-anchor="middle" font="bold 16px Arial" fill="#fff">2</text>
<text x="132" y="171" class="branch">Identity &amp; access management</text>
<text x="100" y="213" class="item">AWS IAM roles and policies</text>
<text x="100" y="244" class="small">Trust policies · Permission policies · Least privilege</text>
<rect class="pill" x="95" y="268" width="445" height="70" rx="10"/>
<text x="112" y="295" class="small">Design checks</text><text x="112" y="319" class="item">MFA · Session duration · Permission boundaries</text>
</g>
<!-- left -->
<g>
<rect class="card" x="65" y="475" width="520" height="230" rx="18" stroke="#2563EB"/>
<circle cx="102" cy="514" r="17" fill="#2563EB"/><text x="102" y="520" text-anchor="middle" font="bold 16px Arial" fill="#fff">3</text>
<text x="132" y="521" class="branch">Workload identity &amp; service access</text>
<text x="100" y="563" class="item">IAM service roles: EC2 to S3</text>
<text x="100" y="594" class="small">Instance profiles · Temporary credentials · Scoped access</text>
<rect class="pill" x="95" y="618" width="445" height="60" rx="10"/>
<text x="112" y="644" class="small">Avoid embedded credentials and long-lived access keys</text>
</g>
<!-- lower left -->
<g>
<rect class="card" x="65" y="805" width="520" height="220" rx="18" stroke="#0F766E"/>
<circle cx="102" cy="844" r="17" fill="#0F766E"/><text x="102" y="850" text-anchor="middle" font="bold 16px Arial" fill="#fff">4</text>
<text x="132" y="851" class="branch">Organization governance &amp; guardrails</text>
<text x="100" y="893" class="item">AWS Organizations and SCPs</text>
<text x="100" y="924" class="small">OU strategy · Account boundaries · Policy inheritance</text>
<text x="100" y="966" class="small">SCPs set maximum permissions; they do not grant access</text>
</g>
<!-- upper right -->
<g>
<rect class="card" x="1215" y="125" width="520" height="245" rx="18" stroke="#7C3AED"/>
<circle cx="1252" cy="164" r="17" fill="#7C3AED"/><text x="1252" y="170" text-anchor="middle" font="bold 16px Arial" fill="#fff">5</text>
<text x="1282" y="171" class="branch">Landing zone &amp; account vending</text>
<text x="1250" y="213" class="item">AWS Control Tower</text>
<text x="1250" y="244" class="small">Landing zone · Account Factory · Guardrails</text>
<rect class="pill" x="1245" y="268" width="445" height="70" rx="10"/>
<text x="1262" y="295" class="small">Design checks</text><text x="1262" y="319" class="item">Log archive · Audit account · Baseline controls</text>
</g>
<!-- right -->
<g>
<rect class="card" x="1215" y="475" width="520" height="230" rx="18" stroke="#0891B2"/>
<circle cx="1252" cy="514" r="17" fill="#0891B2"/><text x="1252" y="520" text-anchor="middle" font="bold 16px Arial" fill="#fff">6</text>
<text x="1282" y="521" class="branch">Secrets &amp; configuration management</text>
<text x="1250" y="563" class="item">AWS Secrets Manager</text>
<text x="1250" y="591" class="item">Systems Manager Parameter Store</text>
<text x="1250" y="632" class="small">Secret rotation · SecureString · Parameter hierarchy</text>
<text x="1250" y="663" class="small">Choose based on secret lifecycle and application needs</text>
</g>
<!-- lower right -->
<g>
<rect class="card" x="1215" y="805" width="520" height="220" rx="18" stroke="#BE123C"/>
<circle cx="1252" cy="844" r="17" fill="#BE123C"/><text x="1252" y="850" text-anchor="middle" font="bold 16px Arial" fill="#fff">7</text>
<text x="1282" y="851" class="branch">Encryption &amp; key management</text>
<text x="1250" y="893" class="item">AWS Key Management Service (KMS)</text>
<text x="1250" y="924" class="small">Key policies · Grants · Rotation · Envelope encryption</text>
<text x="1250" y="966" class="small">Separate key administration from data access where needed</text>
</g>
<!-- bottom -->
<g>
<rect class="card" x="625" y="965" width="550" height="150" rx="18" stroke="#475569"/>
<circle cx="660" cy="1002" r="17" fill="#475569"/><text x="660" y="1008" text-anchor="middle" font="bold 16px Arial" fill="#fff">8</text>
<text x="690" y="1009" class="branch">Workforce access &amp; financial guardrails</text>
<text x="660" y="1047" class="item">IAM Identity Center · AWS Budgets &amp; billing alarms</text>
<text x="660" y="1078" class="small">Federated workforce access · Cost thresholds · Notifications</text>
</g>
<text x="900" y="1160" text-anchor="middle" class="small">Learning map, not a deployment blueprint · Validate service features, permissions, quotas and pricing before implementation</text>
</svg>